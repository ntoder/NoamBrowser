<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Switch to NoamBrowser</title><link rel="stylesheet" href="pages.css"><link rel="stylesheet" href="assets/themes.css">
<style>
  .page { max-width: 820px; }
  .steps { display: flex; gap: 6px; margin: 0 0 20px; flex-wrap: wrap; }
  .steps span { font-size: 12px; font-weight: 700; color: var(--muted); padding: 5px 10px; border-radius: 999px; background: var(--surface-2); }
  .steps span.on { background: var(--accent); color: #fff; } :root[data-theme="dark"] .steps span.on { color: #120D2A; }
  .steps span.done { background: var(--safe-soft); color: var(--safe); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 6px; font-size: 20px; } .card p.sub { margin: 0 0 16px; color: var(--muted); }
  .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .pick button { text-align: left; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); border: 2px solid transparent; display: flex; gap: 12px; align-items: center; }
  .pick button:hover { border-color: var(--accent); } .pick b { display: block; } .pick small { color: var(--muted); }
  .pick .logo { font-size: 26px; }
  .opt { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .opt:last-child { border-bottom: 0; } .opt input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--accent); }
  .opt b { display: block; } .opt span { color: var(--muted); font-size: 13px; } .opt.off { opacity: .5; cursor: default; }
  .acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  .res li { margin: 6px 0; } .res { padding-left: 20px; }
  ol.how li { margin: 7px 0; } code { background: var(--surface-2); padding: 2px 6px; border-radius: 6px; font-size: 13px; }
  .ext { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .ext:last-child { border-bottom: 0; } .ext .t { flex: 1; min-width: 0; } .ext .t span { display: block; color: var(--muted); font-size: 13px; }
  .ext .ok { color: var(--safe); font-weight: 700; font-size: 13px; }
  table.map { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.map th { text-align: left; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.map td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; } table.map td:first-child { font-weight: 600; }
  kbd { font: 12px ui-monospace, Consolas, monospace; background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; }
  .warn { background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-top: 12px; }
  .err { color: var(--danger); font-size: 13px; margin-top: 10px; }
  .row2 { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row2:last-child { border-bottom: 0; } .row2 span { display: block; color: var(--muted); font-size: 13px; }
</style></head>
<body>
<div class="page">
  <div class="page-head"><h1>👋 Switch to NoamBrowser</h1></div>
  <div class="steps" id="steps"></div>
  <div id="view"></div>
</div>
<script src="assets/apply-theme.js"></script>
<script src="common.js"></script>
<script src="switch.js"></script>
</body>
</html>
