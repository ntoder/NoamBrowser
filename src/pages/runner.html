<!doctype html><html><head><meta charset="utf-8"><title>Preview</title></head><body><script>
// Waits for the playground to send code, then becomes that page.
addEventListener('message', function onMsg(e) {
  if (!e.data || e.data.type !== 'noam-run') return;
  removeEventListener('message', onMsg);
  document.open(); document.write(e.data.html); document.close();
});
parent.postMessage({ type: 'noam-ready' }, '*');
</script></body></html>
