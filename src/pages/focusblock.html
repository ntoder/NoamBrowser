<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Focus time</title><link rel="stylesheet" href="pages.css"><link rel="stylesheet" href="assets/themes.css">
<style>
  html, body { height: 100%; }
  body { display: grid; place-items: center; background: radial-gradient(circle at 30% 20%, color-mix(in srgb, #e5484d 18%, var(--bg)), var(--bg) 60%); }
  .card { width: min(560px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 34px 34px 28px; text-align: center; box-shadow: 0 30px 80px -30px rgba(0,0,0,.35); }
  .tomato { font-size: 64px; line-height: 1; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-4deg); } }
  h1 { margin: 14px 0 6px; font-size: 26px; letter-spacing: -.02em; }
  .site { color: var(--muted); font-size: 15px; margin: 0 0 18px; }
  .site b { color: var(--text); }
  .clock { font-size: 54px; font-weight: 850; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin: 8px 0 2px; }
  .clock small { display: block; font-size: 13px; color: var(--muted); font-weight: 650; letter-spacing: 0; }
  .task { margin: 16px auto 0; background: var(--surface-2); border-radius: 14px; padding: 12px 16px; font-weight: 700; max-width: 420px; }
  .task span { display: block; color: var(--muted); font-size: 12px; font-weight: 650; margin-bottom: 2px; }
  .quote { color: var(--muted); font-style: italic; margin: 18px 0 0; font-size: 14px; }
  .acts { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; align-items: center; }
  .btn.big { height: 46px; padding: 0 26px; font-size: 15px; border-radius: 14px; }
  .reasons { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .link { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; }
  .wait { color: var(--muted); font-size: 13px; }
  .phrase { width: 100%; max-width: 420px; box-sizing: border-box; }
  .phrase-q { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  .phrase-q b { color: var(--text); user-select: none; }
  .stats { display: flex; justify-content: center; gap: 22px; margin-top: 20px; color: var(--muted); font-size: 12.5px; font-weight: 650; }
  .stats b { display: block; color: var(--text); font-size: 18px; }
</style></head>
<body>
<div class="card">
  <div class="tomato">🍅</div>
  <h1 id="title">You’re focusing right now</h1>
  <p class="site" id="site"></p>
  <div class="clock" id="clock">--:--<small>left in this focus session</small></div>
  <div class="task" id="task" hidden><span>You said you’d work on</span><b></b></div>
  <p class="quote" id="quote"></p>
  <div class="acts" id="acts"></div>
  <div class="stats" id="stats"></div>
</div>
<script src="assets/apply-theme.js"></script>
<script src="common.js"></script>
<script src="focusblock.js"></script>
</body>
</html>
