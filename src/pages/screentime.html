<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Screen time</title><link rel="stylesheet" href="pages.css"><link rel="stylesheet" href="assets/themes.css">
<style>
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { padding: 7px 14px; border-radius: 9px; font-weight: 750; font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; font-family: inherit; }
  .seg button.on { background: var(--accent); color: #fff; }
  :root[data-theme="dark"] .seg button.on { color: #120D2A; }
  .hero { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; }
  .stat .k { color: var(--muted); font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; }
  .stat .v { font-size: 30px; font-weight: 850; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat .s { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .up { color: var(--danger); } .down { color: var(--safe); }
  .chart { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px 12px; margin-bottom: 20px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 150px; }
  .bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .bars .b i { display: block; width: 100%; max-width: 46px; border-radius: 7px 7px 3px 3px; background: linear-gradient(var(--accent), color-mix(in srgb, var(--accent) 60%, transparent)); min-height: 3px; transition: height .5s cubic-bezier(.2,.8,.2,1); }
  .bars .b.today i { background: linear-gradient(#ee7a2e, #f4a261); }
  .bars .b span { font-size: 10.5px; color: var(--muted); margin-top: 6px; font-weight: 700; white-space: nowrap; }
  .bars .b:hover i { filter: brightness(1.1); }
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 6px; }
  .site { display: grid; grid-template-columns: 30px minmax(120px, 220px) 1fr 90px 120px; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; }
  .site:hover { background: var(--surface-2); }
  .site .fav { width: 26px; height: 26px; border-radius: 7px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
  .site .fav img, .site .fav svg { width: 18px; height: 18px; }
  .site .fav svg { fill: none; stroke: var(--muted); stroke-width: 1.6; }
  .site .n { font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .site .n small { display: block; color: var(--muted); font-weight: 600; font-size: 11.5px; }
  .track { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 6px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .site .t { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
  .site .t small { display: block; color: var(--muted); font-weight: 600; font-size: 11px; }
  .site select { font: 600 12px var(--font); padding: 5px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); width: 100%; }
  .site select.has { border-color: #ee7a2e; color: #c25e10; }
  .over .track i { background: var(--danger) !important; }
  .tools { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 14px; line-height: 1.5; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 760px) { .hero { grid-template-columns: 1fr; } .site { grid-template-columns: 30px 1fr 80px; } .site .track, .site select { display: none; } }
</style></head>
<body>
<div class="page">
  <div class="page-head"><h1>Screen time</h1><div class="seg" id="range"><button data-r="today" class="on">Today</button><button data-r="yesterday">Yesterday</button><button data-r="7">7 days</button><button data-r="30">30 days</button></div></div>
  <div class="hero">
    <div class="stat"><div class="k" id="k-total">Today</div><div class="v" id="v-total">—</div><div class="s" id="s-total"></div></div>
    <div class="stat"><div class="k" id="k-avg">Most time on</div><div class="v" id="v-top" style="font-size:22px;margin-top:10px">—</div><div class="s" id="s-top"></div></div>
    <div class="stat"><div class="k">Sites visited</div><div class="v" id="v-sites">—</div><div class="s" id="s-sites"></div></div>
  </div>
  <div class="chart" id="chart-wrap"><div class="bars" id="bars"></div></div>
  <div class="list" id="list"></div>
  <div class="tools">
    <button class="btn" id="csv">Export to CSV</button>
    <button class="btn" id="clear">Clear all screen time</button>
    <label style="display:flex;gap:8px;align-items:center;font-weight:650;font-size:13px;margin-left:auto">Track time on sites <button class="switch" id="enabled" role="switch"></button></label>
  </div>
  <p class="note">Counted only while you're actually using a tab (or it's playing sound), and never in private tabs. It all stays on this computer — nothing is sent anywhere. Set a daily limit next to a site to get a reminder when you reach it.</p>
</div>
<script src="assets/apply-theme.js"></script>
<script src="common.js"></script>
<script src="screentime.js"></script>
</body>
</html>
