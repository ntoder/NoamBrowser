<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Passwords</title><link rel="stylesheet" href="pages.css"><link rel="stylesheet" href="assets/themes.css">
<style>
  .note { color: var(--muted); margin: -10px 0 18px; font-size: 13px; }
  .note b { color: var(--text); }
  .row .main { flex-direction: column; align-items: flex-start; gap: 0; min-width: 0; }
  .row .u { flex: none; }
  .pw { font-family: 'Cascadia Code', Consolas, monospace; font-size: 13px; color: var(--muted); width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .act { opacity: 1; }
  .tools { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .edit { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 8px; padding: 8px 10px; }
  #report { border-radius: 14px; padding: 14px 16px; margin-bottom: 18px; background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; line-height: 1.5; }
  #report b.bad { color: var(--danger); } #report b.good { color: var(--safe); }
  .flags { display: flex; gap: 4px; flex: none; }
  .flag { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .flag.pwned { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
  .flag.reused, .flag.weak { background: color-mix(in srgb, #D9A21B 18%, transparent); color: #B07E00; }
  :root[data-theme="dark"] .flag.reused, :root[data-theme="dark"] .flag.weak { color: #FFC857; }
  .flag.ok { background: var(--safe-soft); color: var(--safe); }
  .msg { color: var(--muted); font-size: 13px; min-height: 18px; margin: 6px 0 0; }
</style></head>
<body>
<div class="page">
  <div class="page-head"><h1>Passwords</h1><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><input id="q" class="field" placeholder="Search passwords" spellcheck="false"></label></div>
  <p class="note" id="prot"></p>
  <div class="tools">
    <label class="btn">Import from CSV<input type="file" id="csv" accept=".csv,text/csv" hidden></label>
    <button class="btn" id="export">Export to CSV</button>
    <button class="btn primary" id="check">Check for leaked passwords</button>
  </div>
  <div id="report" hidden></div>
  <p class="msg" id="msg"></p>
  <div id="list"></div>
  <div id="never-wrap" hidden><div class="group-label">Never save on these sites</div><div class="rows" id="never"></div></div>
</div>
<script src="assets/apply-theme.js"></script>
<script src="common.js"></script>
<script src="passwords.js"></script>
</body>
</html>
