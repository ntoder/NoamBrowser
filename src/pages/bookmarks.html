<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Bookmarks</title><link rel="stylesheet" href="pages.css"><link rel="stylesheet" href="assets/themes.css">
<style>
  .add { display: flex; gap: 8px; margin-bottom: 18px; }
  .add .field { flex: 1; }
  .row input.field { height: 30px; }
  .grp { margin-bottom: 18px; border-radius: 14px; } .grp.over { outline: 2px dashed var(--accent); outline-offset: 4px; }
  .grp h2 { font-size: 14px; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; } .grp h2 small { color: var(--muted); font-weight: 600; }
  .row select.mv { width: auto; max-width: 170px; height: 30px; font-size: 12px; padding: 0 6px; }
  .namebox { display: flex; gap: 8px; margin: -8px 0 18px; } .namebox .field { flex: 1; }
  .emptyf { color: var(--muted); font-size: 12.5px; padding: 10px 12px; }
</style></head>
<body>
<div class="page">
  <div class="page-head"><h1>Bookmarks</h1><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><input id="q" class="field" placeholder="Search bookmarks" spellcheck="false"></label></div>
  <form class="add" id="add"><input class="field" id="atitle" placeholder="Name"><input class="field" id="aurl" placeholder="https://…" spellcheck="false"><button class="btn primary">Add bookmark</button><button type="button" class="btn" id="newf">📁 New folder</button></form>
  <div id="list"></div>
</div>
<script src="assets/apply-theme.js"></script>
<script src="common.js"></script>
<script src="bookmarks.js"></script>
</body>
</html>
